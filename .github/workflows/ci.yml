# P2 Q6：CI 门禁——ruff + 后端测试 + 前端 typecheck/build
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Run tests
        run: pytest -q --basetemp="$RUNNER_TEMP/pytest"
      - name: Coverage gate (>=90%)
        run: |
          coverage run -m pytest -q --basetemp="$RUNNER_TEMP/pytest-coverage"
          coverage report --fail-under=90

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check & build
        run: npm run build
