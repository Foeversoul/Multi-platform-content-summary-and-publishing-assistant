sources:
  - id: hackernews-rss
    name: Hacker News
    type: rss
    url: https://news.ycombinator.com/rss
    frequency_minutes: 60
  - id: sspai-rss
    name: 少数派
    type: rss
    url: https://sspai.com/feed
    frequency_minutes: 120
  # OpenCLI 数据源需要先安装 opencli，并配置好 Browser Bridge 扩展与已登录的 Chrome，
  # 且所在机器必须能访问外网。默认关闭（enabled: false），配置好后改为 true 即可启用。
  # type=opencli 时 site/command 对应 opencli 的内置适配器；args 为额外参数（如搜索词）。
  - id: bilibili-hot
    name: B站热榜
    type: opencli
    site: bilibili
    command: hot
    limit: 20
    frequency_minutes: 120
    enabled: false
  - id: zhihu-hot
    name: 知乎热榜
    type: opencli
    site: zhihu
    command: hot
    limit: 20
    frequency_minutes: 120
    enabled: false
  - id: hacknews-top
    name: HackerNews Top
    type: opencli
    site: hackernews
    command: top
    limit: 20
    frequency_minutes: 120
    enabled: false
